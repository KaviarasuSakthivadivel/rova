<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rova</title>
    <!-- Applies the saved accent theme before first paint — without this,
         the page would flash violet (the CSS default) then jump to the
         stored choice once React mounts. Mirrors theme.ts's own
         "violet has no override block" logic. -->
    <script>
      (function () {
        try {
          var accent = localStorage.getItem("rova-accent-theme");
          if (accent && accent !== "violet") document.documentElement.setAttribute("data-accent", accent);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
